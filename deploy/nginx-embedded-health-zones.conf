# ---------------------------------------------------------------------------
# Embedded node health service -- http-level declarations.
#
# Installed by deploy.sh to /etc/nginx/conf.d/00-embedded_health_zones.conf.
#
# These live in their own file, named to sort first, so the zones and upstream
# are declared before any server block references them -- including a block in
# an existing site file that merely includes our location snippet.  Debian
# reads conf.d before sites-enabled; the 00- prefix covers RHEL layouts where
# sites and conf.d share a directory.
# ---------------------------------------------------------------------------

upstream embedded_health_app {
    server 127.0.0.1:8787 fail_timeout=10s;
    keepalive 8;
}

# One heartbeat a minute per node is the design point; 30/min per source
# address leaves plenty of headroom while still capping a runaway agent.
limit_req_zone $binary_remote_addr zone=eh_beat:1m rate=30r/m;

# The dashboard polls every 10 s; allow browsers a comfortable ceiling.
limit_req_zone $binary_remote_addr zone=eh_ui:1m rate=120r/m;

limit_req_status 429;
