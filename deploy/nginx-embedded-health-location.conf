# ---------------------------------------------------------------------------
# Embedded node health service -- read-only locations for an EXISTING site.
#
# Installed by deploy.sh to /etc/nginx/embedded_health_location.conf.  It does
# nothing until you add one line inside a server block you already have:
#
#     include /etc/nginx/embedded_health_location.conf;
#
# Use this when people need to read the dashboard from somewhere other than the
# lab subnet -- typically a server block already serving the public hostname on
# the campus interface.
#
# Why a snippet and not a second server block: nginx prefers a specific listen
# address over a wildcard one, so a new block listening on the campus IP would
# capture *every* request to that address and shadow the existing site
# entirely, not just /embedded_health.  Adding locations to the block that
# already owns the name is the only non-destructive way in.
#
# This is deliberately read-only.  The heartbeat endpoint is the service's only
# write path and has no reason to exist anywhere but the subnet the nodes are
# on, so it is refused here, and limit_except refuses anything else that
# mutates state -- including routes added in future, without having to
# enumerate them.
# ---------------------------------------------------------------------------

location = /embedded_health { return 301 /embedded_health/; }

location = /embedded_health/api/heartbeat { return 403; }

location /embedded_health/ {
    limit_req zone=eh_ui burst=40 nodelay;
    limit_except GET HEAD { deny all; }
    proxy_pass http://embedded_health_app/;
    include /etc/nginx/embedded_health_proxy.conf;
}
